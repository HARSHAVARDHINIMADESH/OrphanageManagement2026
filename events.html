<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Events - Hands2Hands</title>

    <link
        rel="stylesheet"
        href="homestyle.css"
    >

    <style>

        .events-page {

            min-height: 100vh;

            padding: 55px 20px;

            background: #f5f9fc;

        }


        .events-container {

            max-width: 1100px;

            margin: auto;

        }


        .events-heading {

            text-align: center;

            margin-bottom: 45px;

        }


        .events-heading h1 {

            color: #1769aa;

            font-size: 38px;

            margin-bottom: 10px;

        }


        .events-heading p {

            color: #607d8b;

            font-size: 17px;

        }


        #eventsList {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(290px, 1fr));

            gap: 25px;

        }


        .event-card {

            background: white;

            padding: 28px;

            border-radius: 16px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);

            transition: 0.3s;

        }


        .event-card:hover {

            transform: translateY(-5px);

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.12);

        }


        .event-card h2 {

            color: #1769aa;

            margin-bottom: 15px;

        }


        .event-description {

            color: #546e7a;

            line-height: 1.6;

            margin-bottom: 20px;

        }


        .event-detail {

            color: #37474f;

            margin: 10px 0;

            line-height: 1.5;

        }


        .event-status {

            display: inline-block;

            margin-top: 15px;

            padding: 6px 14px;

            border-radius: 20px;

            background: #e8f5e9;

            color: #2e7d32;

            font-size: 13px;

            font-weight: bold;

        }


        .no-events {

            grid-column: 1 / -1;

            text-align: center;

            background: white;

            padding: 40px;

            border-radius: 15px;

            color: #607d8b;

        }


        .error-message {

            grid-column: 1 / -1;

            text-align: center;

            background: white;

            padding: 40px;

            border-radius: 15px;

            color: #c62828;

        }


        @media (max-width: 600px) {

            .events-page {

                padding: 35px 15px;

            }


            .events-heading h1 {

                font-size: 30px;

            }

        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">

            <a href="index.html">
                Hands2Hands
            </a>
        </div>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="adopt.html">
                    Adoption
                </a>
            </li>

            <li>
                <a href="donat.html">
                    Donate
                </a>
            </li>

            <li>
                <a href="volunteer.html">
                    Volunteer
                </a>
            </li>

            <li>
                <a href="events.html">
                    Events
                </a>
            </li>

            <li>
                <a href="contact.html">
                    Contact
                </a>
            </li>

        </ul>

    </nav>



    <!-- Events -->

    <main class="events-page">

        <div class="events-container">


            <div class="events-heading">

                <h1>
                    Upcoming Events
                </h1>

                <p>
                    Join us and be part of meaningful
                    activities for children.
                </p>

            </div>


            <div id="eventsList">

                <div class="no-events">

                    Loading events...

                </div>

            </div>


        </div>

    </main>



    <script>

        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function formatDate(dateValue) {

            if (!dateValue) {
                return "Date not specified";
            }


            const date =
                new Date(dateValue);


            if (isNaN(date.getTime())) {
                return dateValue;
            }


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );

        }


        function formatTime(timeValue) {

            if (!timeValue) {
                return "Time not specified";
            }


            const parts =
                String(timeValue).split(":");


            if (parts.length < 2) {
                return timeValue;
            }


            let hour =
                parseInt(parts[0], 10);

            const minute =
                parts[1];


            const period =
                hour >= 12
                    ? "PM"
                    : "AM";


            hour =
                hour % 12 || 12;


            return (
                hour +
                ":" +
                minute +
                " " +
                period
            );

        }


        async function loadEvents() {

            const eventsList =
                document.getElementById(
                    "eventsList"
                );


            try {

                const response =
                    await fetch(
                        "/api/events"
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load events."
                    );

                }


                const events =
                    data.events || [];


                if (events.length === 0) {

                    eventsList.innerHTML = `

                        <div class="no-events">

                            <h2>
                                No Upcoming Events
                            </h2>

                            <p>
                                There are currently
                                no upcoming events.
                            </p>

                        </div>

                    `;

                    return;

                }


                eventsList.innerHTML = "";


                events.forEach(function(event) {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "event-card";


                    card.innerHTML = `

                        <h2>
                            ${escapeHTML(event.title)}
                        </h2>

                        <p class="event-description">
                            ${escapeHTML(
                                event.description ||
                                "Join us for this special event."
                            )}
                        </p>

                        <p class="event-detail">
                            📅
                            <strong>Date:</strong>
                            ${formatDate(event.event_date)}
                        </p>

                        <p class="event-detail">
                            🕐
                            <strong>Time:</strong>
                            ${formatTime(event.event_time)}
                        </p>

                        <p class="event-detail">
                            📍
                            <strong>Location:</strong>
                            ${escapeHTML(
                                event.location ||
                                "Location not specified"
                            )}
                        </p>

                        <span class="event-status">
                            Upcoming
                        </span>

                    `;


                    eventsList.appendChild(
                        card
                    );

                });


            } catch (error) {

                console.error(
                    "Events loading error:",
                    error
                );


                eventsList.innerHTML = `

                    <div class="error-message">

                        <h2>
                            Unable to Load Events
                        </h2>

                        <p>
                            Please make sure the
                            server and database
                            are running.
                        </p>

                    </div>

                `;

            }

        }


        document.addEventListener(
            "DOMContentLoaded",
            loadEvents
        );

    </script>

</body>

</html>
